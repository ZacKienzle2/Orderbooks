default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

minimum_pre_commit_version: "3.5.0"

fail_fast: false

# Hooks come in two flavours:
#
#   1. Pure-Python or pure-Node hooks pulled directly from upstream repos.
#      Pre-commit installs them in isolated envs at first run.
#   2. Local hooks that shell out to system binaries installed via
#      `scripts/bootstrap.sh`. Used for any tool that would otherwise
#      download a binary at install time (and so depend on the host
#      Python's SSL CA chain being healthy).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        # CHANGELOG.md is regenerated by git-cliff, whose template ends with
        # blank lines. Stripping them here makes the changelog workflow's drift
        # check fail on the next run, because regeneration puts them back. The
        # thesis repository carries the same exclusion for the same reason.
        exclude: '^CHANGELOG\.md$'
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-xml
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys", "--indent=2"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["--strict", "--config-file=.yamllint.yaml"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.yaml"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --force-scope
          - feat
          - fix
          - perf
          - refactor
          - docs
          - test
          - build
          - ci
          - chore
          - style
          - revert

  # Every hook below was a repo: local entry with language: system, which runs
  # a binary the machine already has and installs nothing. That is why the
  # workflow grew a job per tool: a runner has none of them, so the checks had
  # to be written a second time in YAML with a second set of versions. Taking
  # each from its own project makes pre-commit install it, so the same check at
  # the same version runs here and on a runner, and the workflow needs one job.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ["-i", "--style=file"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning", "--exclude=SC2310"]

  # Overriding args drops the upstream --write-changes, which the published
  # hook sets by default. The hook is a spell checker with no notion of syntax,
  # and left to rewrite files it edits identifiers and extension lists.
  # Reporting a suspected typo is useful. Applying the correction unattended is
  # not.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # cmakelang publishes no hooks of its own and the third-party mirror stopped
  # in 2022, so pre-commit installs the package itself. language: python with
  # additional_dependencies is its documented way to run a tool from an index,
  # and unlike language: system it does not expect the binary to be present.
  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format
        entry: cmake-format
        language: python
        additional_dependencies: ["cmakelang==0.6.13"]
        files: '(CMakeLists\.txt|\.cmake)$'
        args: ["--in-place", "--line-width=120"]

      # Settings arrive as flags rather than through a .cmake-format.yaml:
      # cmakelang last released in 2021 and its config loader raises on the
      # Python pre-commit picks here, while the flags work.
      #
      # The width matches .editorconfig, where 80 is the tool's own default.
      # The patterns accept the leading underscore that marks a local in CMake
      # and the upper case of CMake's documented variables, so
      # CMAKE_REQUIRED_FLAGS is no longer reported as a badly named local.
      - id: cmake-lint
        name: cmake-lint
        entry: cmake-lint
        language: python
        additional_dependencies: ["cmakelang==0.6.13"]
        files: '(CMakeLists\.txt|\.cmake)$'
        args:
          - "--line-width=120"
          - "--local-var-pattern=_?[A-Za-z][A-Za-z0-9_]+"
          - "--argument-var-pattern=_?[a-z][a-z0-9_]+"
          - "--internal-var-pattern=_?[A-Za-z][A-Za-z0-9_]+"

  # Prose. The official hook is language: golang, so pre-commit builds vale
  # itself: the binary is present on a CI runner as well as here, and the
  # environment is cached after the first build. The hook entry is the bare
  # vale command, so it does not install what .vale.ini names; the first
  # entry runs `vale sync` for that, which the packages documentation says to
  # do before linting. --no-global reads the repository's configuration
  # alone, so the hook reports the same thing here as on a runner.
  - repo: https://github.com/errata-ai/vale
    rev: v3.9.6
    hooks:
      - id: vale
        alias: vale-sync
        name: vale sync
        args: [sync]
        pass_filenames: false
        files: ^\.vale\.ini$
      - id: vale
        args: [--no-global, --minAlertLevel=error, --output=line]
        types_or: [markdown]
