# Managed by copier from ZacKienzle2/repo-template. A repository's own words go
# under [default.extend-words] after this block.

# A generated CHANGELOG.md carries short commit hashes as link text, and typos
# reads the letters in one as a word. A type of its own, unchecked, is typos'
# way to leave a generated file alone.
[type.changelog]
extend-glob = ["CHANGELOG.md"]
check-file = false

[default]
# Skip short identifiers that look like typos but are domain-relevant.
extend-ignore-identifiers-re = [
  "^(bid|ask|qty|px|tif|gtc|ioc|fok|seq|spsc|mpsc|crtp|sfinae|nvi|aad)$",
]

[default.extend-words]
# Words that are real in this project even though typos flags them.
fo = "fo"      # boost::intrusive abbreviations
fpe = "fpe"    # floating-point exception
nd = "nd"      # boost::intrusive::auto_unlink + others
sps = "sps"    # samples-per-second
crate = "crate"
# clang-analyzer-optin.* is a check family name, not a misspelt "option".
optin = "optin"
ba = "ba"            # best ask cursor (matching engine and reference)
bb = "bb"            # best bid cursor (matching engine and reference)
po = "po"            # post-only TIF abbreviation
te = "te"            # taker-execute marker
hte = "hte"          # halt-to-end marker
countr = "countr"    # std::countr_zero / countr_one (C++20 bit ops)
countl = "countl"    # std::countl_zero / countl_one (C++20 bit ops)
popc = "popc"        # std::popcount abbreviation
browseable = "browseable"  # GitHub doc spelling in SUPPORT.md
