# Only what differs from lychee's defaults, which lychee's configuration guide
# lists: timeout, redirects, retries and concurrency are left to them, and
# lychee paces each host itself. lychee-action passes --no-progress, and no
# cache is kept, since nothing carries one from one runner to the next.
# lychee's default accepts 1xx and 2xx and follows redirects to the final
# answer. 403 is added: a public reference site that answers a scanner with
# Forbidden, cppreference among them, is reachable from a browser, and a dead
# link answers 404 or 410, which still fail. 429 is added: a host that rate
# limits the runner has not lost the page.
accept = ["100..=103", "200..=299", "403", "429"]
# lychee's own switches in place of the path and pattern lists that used to
# sit here: it skips what .gitignore names and hidden directories unless told
# otherwise, leaves example domains and mail addresses alone by default, and
# this excludes loopback addresses and localhost. SUPPORT.md links to
# Discussions only when has_discussions is answered true, so that link is
# checked like any other.
exclude_loopback = true
