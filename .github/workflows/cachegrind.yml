name: Cachegrind

# On-demand, deterministic cache-miss attribution for the engine hot paths.
# Cachegrind simulates the cache per instruction, so it needs no PMU and its
# numbers are exact and reproducible on any shared runner, which is why it is
# the methodology of record for miss attribution (ADR-0034). Run it manually
# after a hot-path change to see which functions own the D1 misses.

on:
  workflow_dispatch:
    inputs:
      ops:
        description:
          "Op count per workload under the simulator, which runs about a hundred
          times slower than native"
        required: false
        default: "200000"
      depth:
        description: "Resting depth for the deep workload"
        required: false
        default: "40000"

permissions:
  contents: read

jobs:
  cachegrind:
    name: Cachegrind miss attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The just recipe builds the RelWithDebInfo configuration through Conan.
      - name: Install Conan
        uses: conan-io/setup-conan@ed3942a6883243f4af84e13e49c972f9440fa1c2 # v1.4.0
        with:
          cache_packages: true

      - name: Install valgrind and just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind just

      - name: Run cachegrind over the memory-bound workloads
        env:
          OPS: ${{ inputs.ops }}
          DEPTH: ${{ inputs.depth }}
        run:
          just profile-cachegrind-all "$OPS" "$DEPTH" | tee
          cachegrind-report.txt

      - name: Upload report and raw profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cachegrind-report
          path: |
            cachegrind-report.txt
            artifacts/cachegrind/
          retention-days: 30
