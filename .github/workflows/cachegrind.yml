name: Cachegrind

# On-demand, deterministic cache-miss attribution for the engine hot paths.
# Cachegrind simulates the cache per instruction, so it needs no PMU and its
# numbers are exact and reproducible on any shared runner, which is why it is
# the methodology of record for miss attribution (ADR-0034). Run it manually
# after a hot-path change to see which functions own the D1 misses.

on:
  workflow_dispatch:
    inputs:
      ops:
        description: "Op count per workload under the simulator, which runs about a hundred times slower than native"
        required: false
        default: "200000"
      depth:
        description: "Resting depth for the deep workload"
        required: false
        default: "40000"

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  cachegrind:
    name: Cachegrind miss attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The same configure the build workflow does, so the profiler comes from
      # the RelWithDebInfo preset rather than a compile of its own.
      - name: Export GitHub Actions cache vars
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install vcpkg
        uses: lukka/run-vcpkg@5ad8bfa6267ef808f7d48cf4004c879bed752401 # v11

      - name: Install valgrind and just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind just

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: cmake --preset linux-clang-relwithdebinfo

      - name: Run cachegrind over the memory-bound workloads
        env:
          OPS: ${{ inputs.ops }}
          DEPTH: ${{ inputs.depth }}
        run: just profile-cachegrind-all "$OPS" "$DEPTH" | tee cachegrind-report.txt

      - name: Upload report and raw profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cachegrind-report
          path: |
            cachegrind-report.txt
            artifacts/cachegrind/
          retention-days: 30
