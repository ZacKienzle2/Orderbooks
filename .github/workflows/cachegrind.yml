name: Cachegrind

# On-demand, deterministic cache-miss attribution for the engine hot paths.
# Cachegrind simulates the cache per instruction, so it needs no PMU and its
# numbers are exact and reproducible on any shared runner, which is why it is
# the methodology of record for miss attribution (ADR-0034). Run it manually
# after a hot-path change to see which functions own the D1 misses.

on:
  workflow_dispatch:
    inputs:
      ops:
        description:
          "Op count per workload under the simulator, which runs about a hundred
          times slower than native"
        required: false
        default: "200000"
      depth:
        description: "Resting depth for the deep workload"
        required: false
        default: "40000"

permissions:
  contents: read

jobs:
  cachegrind:
    name: Cachegrind miss attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same configure the build workflow does, so the profiler comes from
      # the RelWithDebInfo preset rather than a compile of its own; the just
      # recipe builds the profiler target.
      - name: Configure the RelWithDebInfo preset
        uses: $/.github/actions/cmake-preset
        with:
          preset: linux-clang-relwithdebinfo
          build: "false"

      - name: Install valgrind and just
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind just

      - name: Run cachegrind over the memory-bound workloads
        env:
          OPS: ${{ inputs.ops }}
          DEPTH: ${{ inputs.depth }}
        run:
          just profile-cachegrind-all "$OPS" "$DEPTH" | tee
          cachegrind-report.txt

      - name: Upload report and raw profiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cachegrind-report
          path: |
            cachegrind-report.txt
            artifacts/cachegrind/
          retention-days: 30
