name: Bench

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "src/**"
      - "bench/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/bench.yml"
  pull_request:
    branches: [main]
    paths:
      - "include/**"
      - "src/**"
      - "bench/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/bench.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  microbench:
    name: Google Benchmark microbench
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install vcpkg
        uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11

      - name: Configure release
        env:
          CC: clang
          CXX: clang++
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: cmake --preset linux-clang-rel

      - name: Build bench
        run: cmake --build --preset linux-clang-rel --target lob_bench --parallel

      - name: Run bench
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./build/linux-clang-rel/bench/lob_bench \
            --benchmark_format=json \
            --benchmark_min_time=0.5s \
            --benchmark_repetitions=5 \
            --benchmark_report_aggregates_only=true \
            --benchmark_out=artifacts/bench.json \
            --benchmark_out_format=json

      - name: Upload bench artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bench-json
          path: artifacts/bench.json
          retention-days: 30

      - name: Latency ceiling gate
        # Absolute, baseline-free ceiling on the engine latency percentiles.
        # Stays active on every run, so a gross algorithmic regression fails
        # the build even before a baseline exists. Ceilings are reference
        # cycles and carry wide headroom over a healthy run; tune here.
        env:
          LATENCY_P50_CEILING: "600"
          LATENCY_P999_CEILING: "8000"
        run: python3 scripts/check_latency_ceiling.py artifacts/bench.json

      # benchmark-action/github-action-benchmark reads Google Benchmark's own
      # JSON, keeps the history in a file actions/cache carries between runs,
      # and fails the job when a benchmark slows past the threshold against
      # the previous run, so neither a committed baseline nor a comparison
      # script is needed. The cache key ends in the run id and restores by
      # prefix, which is how actions/cache documents a cache that moves.
      - name: Restore the benchmark history
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ./cache
          key: benchmark-${{ runner.os }}-${{ github.run_id }}
          restore-keys: benchmark-${{ runner.os }}-

      - name: Gate on regression against the previous run
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: lob_bench
          tool: googlecpp
          output-file-path: artifacts/bench.json
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: "115%"
          fail-on-alert: true
          # A run on main writes the history; a pull request is compared
          # against it without moving it.
          save-data-file: ${{ github.event_name != 'pull_request' }}
