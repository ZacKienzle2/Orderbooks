name: Close stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        # The workflow's token, 60 days to stale, the Stale label and removing
        # it when the item is updated are the action's defaults. A pull
        # request goes stale sooner, and both close 14 days after.
        with:
          days-before-pr-stale: 30
          days-before-close: 14
          exempt-issue-labels: "pinned,security,help wanted,good first issue,blocked"
          exempt-pr-labels: "pinned,security,blocked,work-in-progress"
          exempt-all-milestones: true
          exempt-draft-pr: true
          stale-issue-message: >
            Marked stale due to inactivity. Closing in 14 days unless updated. Comment to keep open.
          close-issue-message: >
            Closed due to inactivity. Reopen if still relevant.
          stale-pr-message: >
            Marked stale due to inactivity. Closing in 14 days unless updated. Push or comment to keep open.
          close-pr-message: >
            Closed due to inactivity. Reopen when ready.
          operations-per-run: 200
          ascending: true
