name: Lock threads

on:
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads
  cancel-in-progress: false

jobs:
  lock:
    name: Lock stale closed threads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Lock
        uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        # The workflow's token and the lock reason resolved are the action's
        # defaults; the windows are shorter than its 365 days.
        with:
          issue-inactive-days: 90
          pr-inactive-days: 30
          process-only: "issues, prs"
          log-output: true
