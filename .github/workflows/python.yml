# The test suite of a Python repository, run in the project's own
# environment from its lock file. Ruff, mypy and the other checks are hooks
# and run in the CI workflow, so nothing is run twice. pyright is the one hook
# that needs this environment, so it runs here through pre-commit, at the
# version .pre-commit-config.yaml pins, and the CI workflow skips it. A
# repository's other Python jobs, a notebook execution or a coverage upload to
# a service, are its own workflows beside this one.
name: Python

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads .python-version and installs that interpreter, and setup-uv
      # caches on the lock file by default.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      # pre-commit/action installs pre-commit with the Python on PATH, which
      # its documentation sets up with setup-python.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Type-check with pyright
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: pyright --all-files

      # deptry compares the declared dependencies against the imports. Its own
      # hook is language: system and wants the binary on PATH, so it runs here
      # from the synced environment rather than as a hook.
      - name: Check the dependencies with deptry
        run: uv run deptry .

      - name: Run the test suite
        run: uv run pytest
