name: Checks

# One required check for every workflow run a pull request starts. The `pass`
# job of ci.yml gathers the jobs of its own workflow through alls-green, and
# cannot see cmake.yml, analysis.yml, fuzz.yml or bench.yml, so auto-merge fired
# while clang-tidy and include-what-you-use still ran (#130). The action waits
# on each workflow run, which stays open until its last job, `needs` included,
# has finished. A workflow that a paths filter never started has no run, so it
# cannot block. CodeQL's default setup runs under the `dynamic` event.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-workflows:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Wait for every other workflow run
        uses: int128/wait-for-workflows-action@bd2118bbaa84a24f15195facd5ff3ba19df7dbd7 # v1.110.0
        with:
          filter-workflow-events: |
            ${{ github.event_name }}
            dynamic
