# Release Drafter's documented workflow: a push to main updates the draft of
# the next release from the pull requests merged since the last one. v7 reads
# each Conventional Commits title itself, so nothing runs on the pull request,
# and the action's defaults already load .github/release-drafter.yml with the
# workflow's token.
name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Draft release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
