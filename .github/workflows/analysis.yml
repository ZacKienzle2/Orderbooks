name: Analysis

# The analyser that needs no compilation database, and the API documentation.
#
# clang-tidy has its own job in cmake.yml, which configures the preset first and
# so can resolve the dependencies' headers. Clang's path-sensitive analyser is
# not run separately here: .clang-tidy already selects the clang-analyzer
# checks, so that job runs it against a database that resolves every include,
# where a standalone invocation here resolved none.

# No paths filter. One has to name every input of both jobs, and the list here
# had already fallen behind two of them. README.md is a Doxygen INPUT, so a
# change to it can raise a documentation warning that the filter would skip,
# and .clang-format changes what cppcheck parses. actionlint checks that a
# glob is well formed and cannot check that it is complete, branch protection
# requires no status check, and these runners are free on a public repository,
# so the filter bought nothing that its drift did not cost.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      # Suppressions live next to the code they cover, as cppcheck's own inline
      # comments, so there is no central list to drift from the source.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability,style --inline-suppr \
            --std=c++20 --language=c++ --suppress=missingIncludeSystem \
            --suppress=unusedFunction --suppress=unmatchedSuppression \
            --error-exitcode=1 -q -I include -I . include/lob apps

  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The action installs the release Doxygen publishes, so this job and a
      # working copy run the same version. apt ships whatever the runner image
      # froze, which was three minor versions behind and raised warnings that
      # could not be reproduced locally. graphviz still comes from apt because
      # its output is stable across the versions in question.
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Install doxygen
        uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758 # v2.0.3

      - name: Build the API documentation
        run: |
          mkdir -p artifacts/doxygen
          DOXYGEN_HAVE_DOT=YES doxygen Doxyfile

      - name: Upload the generated documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doxygen-html
          path: artifacts/doxygen/html/
          retention-days: 14
