name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependencies via OSV
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    # OSV owns dependency advisories, so the scan runs everywhere.
    # Code scanning takes the report from public repositories only. The
    # reusable workflow's default scan-args, --recursive from the root, is
    # the whole scan; osv-scanner v2 no longer reads the .git root unless
    # told to, which is why the --skip-git once passed here was removed.
    with:
      upload-sarif: ${{ github.event.repository.private == false }}
      results-file-name: osv-results.sarif
    permissions:
      contents: read
      security-events: write
      actions: read
