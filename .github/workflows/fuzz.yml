name: Fuzz

# Coverage-guided fuzzing of the three places this process reads bytes it did
# not write: the FIX parser, snapshot restore, and the gateway's wire decode.
# Nothing here says which inputs to try. libFuzzer derives them from the
# coverage each harness reaches, and the sanitizers decide what counts as a
# failure, so the run finds the cases nobody thought to write down.
#
# A pull request gets a short budget per harness, enough to replay the corpus
# and explore around it. The scheduled run is the long one. A schedule event
# has no inputs, so the long budget is the fallback rather than the input's
# default, which a scheduled run would never read.

on:
  pull_request:
    paths:
      - "include/lob/**"
      - "src/**"
      - "apps/gateway/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Sunday, early. The long run is where new coverage actually comes from.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description:
          "Budget per harness, in seconds, or empty for the scheduled budget"
        required: false

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Conan
        uses: conan-io/setup-conan@ed3942a6883243f4af84e13e49c972f9440fa1c2 # v1.4.0
        with:
          cache_packages: true

      # ctest replays each corpus and then fuzzes it, every harness at once. A
      # crash leaves its input beside the corpora, so the step fails and the
      # artifact upload below carries the reproducer.
      - name: Fuzz each harness
        env:
          FUZZ_SECONDS:
            ${{ inputs.seconds || (github.event_name == 'pull_request' && '60')
            || '300' }}
        run: >-
          conan build . -s:a compiler.cppstd=20 -s build_type=Debug -o
          "&:sanitizer=address,undefined" -o "&:fuzz=ON" --build=missing -c
          "&:tools.cmake.cmaketoolchain:extra_variables={'LOB_FUZZ_SECONDS':
          '$FUZZ_SECONDS'}"

      - name: Upload corpora and any reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: |
            artifacts/fuzz/
          retention-days: 30
