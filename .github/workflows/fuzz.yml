name: Fuzz

# Coverage-guided fuzzing of the three places this process reads bytes it did
# not write: the FIX parser, snapshot restore, and the gateway's wire decode.
# Nothing here says which inputs to try. libFuzzer derives them from the
# coverage each harness reaches, and the sanitizers decide what counts as a
# failure, so the run finds the cases nobody thought to write down.
#
# A pull request gets a short budget per harness, enough to replay the corpus
# and explore around it. The scheduled run is the long one. A schedule event
# has no inputs, so the long budget is the fallback rather than the input's
# default, which a scheduled run would never read.

on:
  pull_request:
    paths:
      - "include/lob/**"
      - "src/**"
      - "apps/gateway/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Sunday, early. The long run is where new coverage actually comes from.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description:
          "Budget per harness, in seconds, or empty for the scheduled budget"
        required: false

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure and build the fuzz preset
        uses: $/.github/actions/cmake-preset
        with:
          preset: linux-clang-fuzz
          configure-args: >-
            -DLOB_FUZZ_SECONDS=${{ inputs.seconds || (github.event_name ==
            'pull_request' && '60') || '300' }}

      # ctest replays each corpus and then fuzzes it, every harness at once. A
      # crash leaves its input beside the corpora, so the step fails and the
      # artifact upload below carries the reproducer.
      - name: Fuzz each harness
        run: ctest --preset linux-clang-fuzz

      - name: Upload corpora and any reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: |
            artifacts/fuzz/
          retention-days: 30
