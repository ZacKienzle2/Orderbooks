name: CMake

on:
  pull_request:
    branches: [main]
    paths:
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "bench/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".clang-format"
      - ".clang-tidy"
      - ".github/workflows/cmake.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-test:
    name: ${{ matrix.preset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-clang-rel
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-clang-debug
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-gcc-rel
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            preset: linux-gcc-debug
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            preset: linux-clang-asan
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-clang-tsan
            cc: clang
            cxx: clang++
          - os: macos-14
            preset: macos-clang-rel
            cc: clang
            cxx: clang++
          - os: macos-14
            preset: macos-clang-debug
            cc: clang
            cxx: clang++
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Export GitHub Actions cache vars
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install vcpkg
        uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11
        with:
          runVcpkgInstall: false

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  iwyu:
    name: include-what-you-use
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install iwyu
        run: sudo apt-get update && sudo apt-get install -y iwyu

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install vcpkg
        uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11

      - name: Configure compile_commands.json
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run:
          cmake --preset linux-clang-rel -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE="iwyu"

      - name: Build to surface IWYU advice
        run: cmake --build --preset linux-clang-rel --parallel

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install vcpkg
        uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11

      - name: Configure
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        # Module scanning emits @<tu>.o.modmap response files into the compile
        # commands. They are generated during the build, which this job skips,
        # so clang-tidy cannot open them and reports a clang-diagnostic-error.
        # Disable scanning so the exported compile commands carry no modmap.
        run: cmake --preset linux-clang-rel -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      # cpp-linter runs clang-tidy over the files the pull request changed, with
      # the compilation database this job configured and the checks and header
      # filter .clang-tidy names. It replaces a shell block that computed the
      # changed files with git and carried the header filter a second time,
      # the apt install of a clang the action brings itself, and the separate
      # clang-format job, since style: file checks formatting as well.
      - name: Run clang-tidy on changed files
        id: linter
        uses: cpp-linter/cpp-linter-action@cab1143a2c149bc41e85b070a9de81716974c18f # v2.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 18
          database: build/linux-clang-rel
          tidy-checks: ""
          style: file
          files-changed-only: true
          step-summary: true
          thread-comments: false

      # The action's documented way to make its findings fail the job.
      - name: Fail on findings
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
