name: CMake

# No paths filter. This is the correctness gate, and a filter that omits one
# of the build's directories is silence rather than a failure: the workflow
# does not run, nothing reports it, and a green pull request means only that
# nothing was built. PR #56 was that for apps/**, and fuzz/** was the same hole
# again once add_subdirectory(fuzz) arrived and clang-tidy began reading those
# sources. actionlint validates the glob syntax of a filter and no tool checks
# whether one covers the build, so the filter was a list kept by hand.
#
# It bought runner minutes, which GitHub does not charge for a public
# repository on standard runners, and main requires no status check, so a
# skipped workflow was never what let a pull request merge either.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cmake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.preset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-clang-rel
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-clang-debug
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-gcc-rel
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            preset: linux-gcc-debug
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            preset: linux-clang-asan
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            preset: linux-clang-tsan
            cc: clang
            cxx: clang++
          - os: macos-14
            preset: macos-clang-rel
            cc: clang
            cxx: clang++
          - os: macos-14
            preset: macos-clang-debug
            cc: clang
            cxx: clang++
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/cmake-preset
        with:
          preset: ${{ matrix.preset }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  iwyu:
    name: include-what-you-use
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install iwyu
        run: sudo apt-get update && sudo apt-get install -y iwyu

      - name: Build to surface IWYU advice
        uses: ./.github/actions/cmake-preset
        with:
          preset: linux-clang-rel
          configure-args: -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE=iwyu

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Module scanning emits @<tu>.o.modmap response files into the compile
      # commands. They are generated during the build, which this job skips,
      # so clang-tidy cannot open them and reports a clang-diagnostic-error.
      # Disable scanning so the exported compile commands carry no modmap.
      #
      # The fuzz harnesses are built too, though this job compiles nothing,
      # because their commands are what puts them in the database. Without
      # them clang-tidy falls back to a guessed command carrying the build
      # type's NDEBUG, which deletes the assertions the harnesses are written
      # around and reports every variable they check as unused.
      - name: Configure the compilation database
        uses: ./.github/actions/cmake-preset
        with:
          preset: linux-clang-rel
          configure-args: -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DLOB_BUILD_FUZZ=ON
          build: "false"

      # cpp-linter runs clang-tidy over the files the pull request changed, with
      # the compilation database this job configured and the checks and header
      # filter .clang-tidy names. It replaces a shell block that computed the
      # changed files with git, carried the header filter a second time, and
      # apt-installed a clang the action brings itself.
      #
      # style is empty, which turns the action's clang-format off. Formatting is
      # the pre-commit hook's job, which pins one version in one file and runs
      # over the whole tree rather than over one pull request's files. Letting
      # this action format as well pinned a second version here, and the two
      # disagreed about where a brace goes, so a file could satisfy the hook
      # that rewrote it and fail the job that read it.
      - name: Run clang-tidy on changed files
        id: linter
        uses: cpp-linter/cpp-linter-action@dacf512996b9cfe9d9bcc7b326d1f3a64ab7b91f # v2.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 18
          database: build/linux-clang-rel
          tidy-checks: ""
          style: ""
          files-changed-only: true
          step-summary: true
          thread-comments: false

      # The action's documented way to make its findings fail the job.
      - name: Fail on findings
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
