# The labels the workflows and Dependabot name. Release Drafter reads the
# Conventional Commits type from each pull request title, so no type has a
# label. GitHub's own defaults (bug, enhancement, documentation, question and
# the rest) exist on every repository and are left alone; the stale label is
# created by the action that applies it; labels-sync does not delete what this
# file does not list.
- name: "breaking"
  color: "b60205"
  description: "Breaking change; a major bump"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "security"
  color: "ee0701"
  description: "Security-related"
- name: "skip-changelog"
  color: "ededed"
  description: "Left out of the release notes"
- name: "pinned"
  color: "0052cc"
  description: "Exempt from the stale bot"
- name: "blocked"
  color: "b60205"
  description: "Blocked on a dependency or a decision; exempt from the stale bot"
- name: "work-in-progress"
  color: "fbca04"
  description: "Not ready for review; exempt from the stale bot"
