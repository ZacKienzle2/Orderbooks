# Managed by copier from ZacKienzle2/repo-template. copier update re-renders the
# previous template version, takes the repository's own edits as the diff
# against it, and applies them over the new version, so a dependency uv adds
# or a per-file ignore a repository writes survives each update. The ruff,
# mypy and pytest settings are the Scientific Python Development Guide's.
# repo-review's PP002 asks for a build backend, and without one the code is
# importable only through pytest's pythonpath and pyright's extraPaths, two
# settings saying the same thing while the language server still reports every
# import unresolved. With one, uv sync installs the package and each tool
# resolves it the same way.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderbooks"
version = "0.0.0"
requires-python = ">=3.12"
description = "Repository tooling and analysis harness for the Orderbooks C++ matching engine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zac Kienzle" }]
keywords = [
  "limit-order-book",
  "matching-engine",
  "high-frequency-trading",
  "low-latency",
  "harness",
  "tooling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
]

# What the harness under scripts/ imports. deptry reads this against the
# imports and reports either side that the other does not name.
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "orjson>=3.11.9",
  "streamlit>=1.38",
]

[project.urls]
Repository = "https://github.com/ZacKienzle2/Orderbooks"
Issues = "https://github.com/ZacKienzle2/Orderbooks/issues"
Changelog = "https://github.com/ZacKienzle2/Orderbooks/blob/main/CHANGELOG.md"

# src/ holds the C++ library, so the Python package is not at src/<name> and
# hatchling cannot infer it. bench_ci.py is a loose module beside it rather
# than part of the package, which is why pytest still carries a pythonpath.
[tool.hatch.build.targets.wheel]
packages = ["scripts/orderbooks_viz"]

[tool.hatch.build.targets.sdist]
include = ["scripts/orderbooks_viz", "README.md", "LICENSE"]

# pyright's hook runs in an environment of its own, so the test dependencies
# have to be ones uv syncs rather than ones passed to a one-off `uv run --with`.
[dependency-groups]
dev = [
  "pytest>=8",
  # The cli extra is what `hypothesis write` needs, and the generate session
  # runs it from this environment. Passing it to `uv run --with` instead builds
  # an overlay environment on every call, measured at 2.7 seconds each.
  "hypothesis[cli]>=6",
  "pytest-benchmark>=5",
  "nox>=2025",
  # cosmic-ray reruns the whole suite once per mutant, so a suite that can hang
  # or that depends on its own order costs far more here than it does once.
  # pytest-randomly reorders every run and reseeds the standard random module
  # per test, which surfaces a test that only passes after another one.
  # pytest-timeout ends a mutant that turned a loop bound into a wider one
  # rather than letting the session stall on it, and needs the value set under
  # [tool.pytest] below to do anything at all.
  #
  # pytest-xdist is deliberately absent. It disables every benchmark the moment
  # it is active, reporting "Benchmarks are automatically disabled because
  # xdist plugin is active", and filterwarnings = ["error"] does not catch that
  # because the warning is raised while plugins configure rather than during a
  # test. A parallel run would pass with nothing measured. cosmic-ray does not
  # want it either: its distributor runs the whole test command once per mutant
  # and the command stops at the first failure, so there is nothing for xdist
  # to spread.
  "pytest-randomly>=3",
  "pytest-timeout>=2",
  # pytest-testmon records which lines each test executed, using coverage.py,
  # and on the next run selects the tests a change affects. The inner loop then
  # costs the affected tests rather than the suite. It writes .testmondata and
  # turns its own selection off under a debugger or a coverage run, and when
  # the invocation already narrows the set with -k, -m or a node id, so it
  # cannot quietly skip a test that was asked for by name.
  "pytest-testmon>=2",
  # Coverage answers which lines the generated tests execute. A survivor from
  # cosmic-ray on an uncovered line is a different problem from one on a
  # covered line, and only the report separates them. Left out of addopts
  # because the number is wanted when that question is asked rather than on
  # every run. It was left out first for a reason that measurement did not
  # support: the same benchmark ran at 543.2 us without --cov and 533.0 us
  # with it, a difference well inside a standard deviation of 107 us, because
  # coverage uses sys.monitoring on a modern interpreter.
  "pytest-cov>=6",
  # The benchmark that needs no test file. verification.md prescribes it for
  # comparing two implementations, with the pytest-benchmark fixture reserved
  # for a number that has to be rechecked in CI.
  "pyperf>=2.10",
  # big_O is deliberately absent. It fits measured time against complexity
  # classes, which reports the constant factors rather than the order: over the
  # two luck balance implementations it called the heap one Linearithmic and
  # the Timsort one Linear, the reverse of both. Widening the range to separate
  # them raised IndexError from inside the package. verification.md records it
  # with those limits, and `uv run --with big-O` reaches it when the order is
  # genuinely the question. Timing at the largest input the constraints allow
  # answers whether the code is fast enough, which is the question asked.
  # deptry reads the declared dependencies and the imports and reports the ones
  # declared and never imported, imported and never declared, and reached only
  # through another package. Its own pre-commit hook is language: system, which
  # needs the binary already on PATH, so it runs from this environment in the
  # Python workflow the way pyright does.
  "deptry>=0.25",
  # noxfile.py rewrites mutation.toml's module-path and test-command into a copy
  # under the session's temporary directory, so the module to mutate is named on
  # the command line rather than in the file. tomllib reads it and this writes
  # it. The PEP 723 block declares it as well, which keeps ./noxfile.py runnable
  # on a machine holding uv alone, and naming it here is what pyright and mypy
  # resolve it through.
  "tomli-w>=1.2",
]

# The selection is the Scientific Python Development Guide's, which is what
# repo-review's RF101 reads. This section was empty, so a rendered repository
# linted with ruff's own defaults, which are E4, E7, E9 and F alone: no
# bugbear, no pyupgrade and no docstring check. The codes come from that guide
# rather than from a list assembled here, and `ruff linter` prints what each
# one covers.
#
# D and its convention are the exception, added because python.md requires
# Google docstrings on every public function, method and class and gives this
# exact pair as what enforces them. The guide does not select D.
#
# ISC is left out although the guide lists it. ruff's formatter documentation
# names ISC001 as a rule that conflicts with the formatter, and a selection
# holding it prints a warning on every run.
#
# No target-version: ruff's settings reference recommends
# project.requires-python over it.
[tool.ruff]
line-length = 100
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle, required by python.md
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort, which the formatter does not do
  "N",    # pep8-naming, which python.md defers to ruff, like D below
  "ICN",  # flake8-import-conventions
  "LOG",  # flake8-logging
  "PIE",  # flake8-pie
  "NPY",  # NumPy specific rules
  "PD",   # pandas-vet
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # hypothesis write emits a module and functions without docstrings, and the
  # file is committed as it arrives.
  "D100",
  "D103",
  "T20",
]

# bench_ci.py is a command-line tool whose report is its standard output, so
# T20 is asking it not to do the one thing it is for.
"scripts/bench_ci.py" = ["T20"]

# The guide's mypy settings. A repository's own per-module sections, a
# package that ships no types or a module whose decorators are untyped, are
# the mypy_overrides answer in .copier-answers.yml.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# The sp-repo-review hook runs the guide's checks on every commit, so a
# deviation has to be recorded rather than remembered. repo-review documents
# the ignore list as a table whose values are reasons, and prints the reason in
# the report, which a bare list of codes would not. Both entries below are
# decisions rather than omissions.
#
# The PY00x checks for a README, a LICENSE, a docs folder and a tests folder
# are deliberately not ignored. A repository without them should be told.
[tool.repo-review.ignore]
PC170 = "pygrep-hooks checks reStructuredText, which no repository here writes"
PC140 = "Matches the mirrors-mypy, pyrefly and ty repository URLs alone. mypy runs as a local hook through uv, where the project's own packages resolve, and pyright gates beside it"

# The native [tool.pytest] table, which pytest 9 reads with TOML types, and
# `strict`, which pytest 9 documents as the one switch for strict_config,
# strict_markers, strict_parametrization_ids, strict_xfail and whatever
# strictness a later release adds. Its reference recommends it for a pinned
# pytest, which uv.lock is. The three settings it replaced were two addopts
# flags and xfail_strict, a hand-kept subset of that list.
[tool.pytest]
minversion = "9"
strict = true
addopts = ["-ra"]
filterwarnings = ["error"]
log_cli_level = "INFO"
# repo-review PP304: log_level is what puts logs on a failure, where
# log_cli_level above governs live output alone.
log_level = "INFO"
testpaths = ["tests/harness"]
pythonpath = ["scripts"]
# pytest-timeout does nothing until a value is set, so the package alone would
# have been a dependency that looked like protection. This one is loose on
# purpose: it ends a test that has genuinely hung without touching a slow but
# working one. A mutation run passes a much tighter --timeout in its own
# test-command, which overrides this, because there the point is to separate a
# mutant that loops forever from one the tests actually catch. A string because
# the native table checks each value against the type the plugin declared, and
# pytest-timeout declares this one as a string.
timeout = "300"

# The guide's coverage section, as its own template renders it. Without
# run.source, coverage measures everything the run imports, tests and
# dependencies included, so the number never answered which package lines the
# tests reach. exclude_also drops the two lines that never execute by design.
[tool.coverage]
run.source = ["scripts", "tests/harness"]
report.exclude_also = ['\.\.\.', 'if typing.TYPE_CHECKING:']

# The pydoclint hook passes --config=pyproject.toml, and pydoclint exits with
# an error when the file has no section of its own, so a repository without
# this block fails that hook on its first commit. The style matches the
# convention ruff's pydocstyle rules are set to, and the signatures carry the
# types, so the docstrings do not repeat them.
# deptry reads the imports against the declarations, and two of its findings
# are about files this repository does not write. noxfile.py is the template's
# and imports nox and tomli_w, which are dev dependencies because that is where
# the template declares them, so DEP004 fires on every rendered repository.
# orderbooks_viz is this repository's own package, imported by absolute name
# because streamlit runs dashboard.py as a script, where a relative import has
# no parent package to resolve against.
[tool.deptry]
known_first_party = ["orderbooks_viz"]

[tool.deptry.per_rule_ignores]
DEP004 = ["nox", "tomli_w"]

[tool.pydoclint]
style = "google"
# ruff's D107 requires a docstring on __init__ under the google convention,
# and pydoclint's DOC301 rejects one unless this is set.
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
# DOC404 compares the type in a Yields section against the annotation, which is
# the same repetition check-return-types turns off one line above. The noxfile
# yields None from an Iterator[None] and the section says so in prose.
check-yield-types = false

# pyright-python's pre-commit hook runs in an environment of its own that
# cannot see the project's packages, and its README's fix is to name the
# virtual environment uv syncs. Both values are relative, so every checkout
# resolves the same one.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["scripts", "tests/harness"]
exclude = [
  "**/.venv",
  "**/build",
  "**/build-*",
  "**/vcpkg_installed",
  "**/.nox",
]
