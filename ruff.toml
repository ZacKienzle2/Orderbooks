# Managed by copier from ZacKienzle2/repo-template. ruff loads ruff.toml ahead
# of pyproject.toml's [tool.ruff] by its own precedence, and extend merges this
# file over that section, so a repository's rule selection and per-file
# ignores stay in pyproject.toml and the width comes from the template.
extend = "pyproject.toml"
line-length = 100
