extends: default

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  node_modules/
  .git/
  .venv/
  dist/
  build/
  .pytest_cache/
  .ruff_cache/
  __pycache__/
  # clang's own configuration files happen to be YAML, and their formatting is
  # clang's convention rather than this project's: .clang-tidy writes
  # CheckOptions as inline maps with spaces inside the braces, and
  # .clang-format uses Yes and No where yamllint wants true and false. The
  # workflow's yamllint never saw either, because it selects by file name and
  # neither is a .yml; the hook selects by content and does.
  .clang-tidy
  .clang-format
