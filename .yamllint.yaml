extends: default

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

# The generated ignore file already lists the caches and build directories, and
# yamllint reads it directly rather than keeping a second copy. The key is
# mutually exclusive with `ignore`, so the list is gone. .yamlignore exists only
# where a tracked file is YAML by shape and not this project's to format, which
# is clang's configuration. Where there is no such file, copier writes none.
ignore-from-file: [.gitignore, .yamlignore]
