extends: default

rules:
  # prettier wraps YAML and is what this linter reads; a scalar prettier cannot
  # break is not an error a second tool should raise.
  line-length: disable
  document-start: disable
  truthy:
    # The rule's own option. Yes and No are the spelling clang-format's
    # documentation uses for its booleans, so .clang-format is linted like
    # every other YAML file rather than listed as an exception.
    allowed-values: ["true", "false", "on", "off", "Yes", "No"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  # prettier formats every YAML file here and this lints what prettier writes,
  # so these rules take prettier's documented style where it differs from
  # yamllint's defaults: a space inside a flow mapping's braces
  # (bracketSpacing, default true) and none in an empty pair, and a block
  # sequence indented or not as the file already does it. yamllint's defaults
  # already want no space inside a flow sequence's brackets and an indent width
  # that stays consistent within a file.
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  indentation:
    indent-sequences: consistent

# The generated ignore file already lists the caches and build directories, and
# yamllint reads it directly rather than keeping a second copy. The key is
# mutually exclusive with `ignore`, so the list is gone.
ignore-from-file: [.gitignore]
