# Settings of the measurement workflow. A run takes every setting from this file and none from its
# command line, so the configuration archived beside a result reproduces it (Ingo and Daly, DBTest
# 2020, sections 2.1 and 2.4).

# The configure, build and test preset of CMakePresets.json whose binaries are measured. The conda
# presets take their compilers from the toolchain environment the rules deploy.
preset: conda-clang-rel

# Executions of each measured process. Kalibera and Jones (ISMM 2013, section 9.1) open with an
# initial experiment of 30 repetitions at each level, from which the variances dimension the real
# experiment.
repeats: 30

# Top-down level 1 metrics of perf, each measured by a process of its own. The fc430 nodes run
# without hyper-threading, so the kernel schedules eight general counters a core, and four of them
# count while the other four read zero. The NMI watchdog holds the fixed cycle counter. The
# TopdownL1 group asks for seven general events and three of them read zero, and a metric of four
# or fewer general events reads true. Front end bound and retiring fit. Bad speculation takes six,
# and back end bound is the remainder of all three.
metrics:
  - tma_frontend_bound
  - tma_retiring

# Offered loads of the latency phase of the load generator, as fractions of the rate its
# throughput phase reached. Load 0 keeps the phase closed with one pair in flight, which times
# service alone. At 0.8 a closed generator understated the p99 by more than two times (Treadmill,
# ISCA 2016, section II.A).
loads:
  - 0
  - 0.8
