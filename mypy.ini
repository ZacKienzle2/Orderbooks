# Managed by copier from ZacKienzle2/repo-template. mypy reads the first of
# mypy.ini, .mypy.ini and pyproject.toml it finds, so this file is the whole
# configuration; the settings are the Scientific Python Development Guide's
# recommendation. A module whose package ships no types gets an override
# after this block, which copier update carries forward:
#
#   [mypy-somepackage.*]
#   ignore_missing_imports = True
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
